<!doctype html>
<html lang="en" data-theme="classic">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0e1114">
  <title>Retro Phone Simulator</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./css/reset.css">
  <link rel="stylesheet" href="./css/phone.css">
  <link rel="stylesheet" href="./css/screen.css">
  <link rel="stylesheet" href="./css/components.css">
</head>
<body>
  <main class="stage">
    <div class="phone">
      <div class="speaker" aria-hidden="true"></div>
      <div class="bezel">
        <div class="lcd" role="region" aria-label="Phone screen">
          <div class="lcd-status">
            <span class="signal" role="img" aria-label="Signal"><i></i><i></i><i></i><i></i></span>
            <span class="operator"><span id="indicators"></span>RETRO</span>
            <span class="battery" id="battery" data-level="4" role="img" aria-label="Battery"><i></i><i></i><i></i><i></i></span>
          </div>
          <div class="lcd-body" id="lcd-body"></div>
          <div class="lcd-soft"><span id="soft-left"></span><span id="soft-right"></span></div>
          <div class="lcd-toast" id="lcd-toast" role="status" hidden></div>
        </div>
      </div>
      <div class="keypad" id="keypad" role="group" aria-label="Keypad"></div>
    </div>
  </main>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
